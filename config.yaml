# Tunable defaults for the GI guidelines RAG pipeline.
# All values can be overridden by env vars or CLI flags later.

# ---------- Embeddings ----------
embedding:
  # "voyage" | "openai" | "bge". The chosen provider must match the schema
  # dimension AND must match what produced the chunks.embedding column —
  # swapping providers without re-ingesting silently produces nonsense scores.
  provider: voyage
  voyage_model: voyage-3-large            # 1024-dim, retrieval-tuned (project default)
  openai_model: text-embedding-3-large    # 3072-dim, fallback only
  bge_model: BAAI/bge-large-en-v1.5       # 1024-dim, local CPU/GPU; same dim as voyage
  batch_size: 100                         # Voyage hard cap is 128; keep some headroom

# ---------- Chunking ----------
# These knobs are the most worth tuning once you eyeball Phase 2 output.
# The chunker is section-aware: it splits long sections into overlapping windows
# but never breaks a recommendation block mid-sentence.
chunking:
  target_tokens: 500       # aim for 400-600 tokens per chunk
  min_tokens: 200          # below this, a chunk is merged with its neighbor
  max_tokens: 800          # hard cap; above this we force a split on sentence boundary
  overlap_tokens: 50       # context bleed between adjacent chunks
  tokenizer: cl100k_base   # tiktoken encoding used for counting (GPT-4 family; fine as a proxy)

# ---------- PDF parsing ----------
parsing:
  strategy: hi_res         # "hi_res" (best, slow) or "fast" (worse, ~10x faster)
  infer_table_structure: true
  fallback_to_fast_after_seconds: 600  # if hi_res hangs, fall back to fast

# ---------- Retrieval (Phase 3) ----------
retrieval:
  top_k_dense: 60          # vector candidates pulled from pgvector
  top_k_bm25: 60           # keyword candidates from Postgres FTS
  # When True (default) and the caller didn't already filter by element_types,
  # we run an extra dense+BM25 pass restricted to typed chunks (table /
  # recommendation / key_concept) and union those into RRF as additional
  # ranked lists. This keeps the answer chunk findable when the table-row text
  # ("col1 | col2 | ...") doesn't outscore a rationale paragraph in the open
  # pool — the situation that bit the LGD-surveillance probe.
  boost_typed_chunks: true
  n_typed_dense: 20
  n_typed_bm25: 20
  n_fused: 20              # candidates kept after RRF fusion, fed to the reranker
  top_k: 6                 # final passages returned to the caller (Phase 4 generator)
  rerank_top_n: 6          # alias of top_k kept for older call sites
  reranker_provider: cohere  # "cohere" (API) | "bge" (local cross-encoder)
  cohere_model: rerank-english-v3.0
  bge_reranker_model: BAAI/bge-reranker-v2-m3  # only used when reranker_provider=bge
  # --- post-rerank floors ---
  typed_floor: true
  typed_floor_types: [table, recommendation]
  # Society-diversity floor: when the fused candidate head spans this many or
  # more societies, ensure each contributes at least one chunk. Counters
  # Cohere's tendency to pile rerank slots onto whichever society's writing
  # most resembles a direct answer.
  society_floor: true
  society_floor_min_societies: 2
  society_floor_pool_size: 20
  # Floor promotions only fire when the candidate's score is at least this
  # fraction of the top candidate's score. Applies to BOTH the typed floor
  # and the society floor. Uses Cohere relevance scores when available
  # (sharp 0-1 dynamic range), falls back to RRF (0.01-0.04 range) when not.
  # Default 0.1 = 10% of the top score:
  #   - For high-confidence queries (top cohere ~1.0): floor at 0.10, blocks
  #     tangential chunks (e.g. AGA Gastric-Polyps BPA on a SEL question
  #     scored 0.012 by cohere → blocked).
  #   - For low-confidence queries (top cohere ~0.4, e.g. cross-society
  #     "do they agree?" comparisons): floor at 0.04, lets cross-society
  #     contributions through (ACG gastroparesis rec scored ~0.10 → kept).
  # Set to 0 to disable the gate (allow all floor promotions, original
  # Phase-3 behavior — useful when debugging recall regressions).
  society_floor_min_rrf_ratio: 0.1
  # --- Multi-query expansion (Phase 6) ---
  # When enabled, a Haiku call rewrites the user's question into N concise
  # paraphrases that make implicit clinical intent explicit (e.g.
  # "no history of bleeding" → "primary prophylaxis, varices that have
  # not bled"). Each variant runs as an additional dense+BM25 branch and
  # is fused into the same RRF pool as the original query. The original
  # query is always preserved — variants augment, never replace.
  # Cost: ~$0.001 + ~500ms per query (Haiku).
  query_expansion:
    enabled: true
    n_variants: 3

# ---------- UI (Phase 5) ----------
ui:
  title: "GI Guidelines Assistant"
  subtitle: "Grounded answers from AGA, ACG, ASGE, and AASLD"
  default_top_k: 6
  show_debug_toggle: true
  phi_check:
    enabled: true


# ---------- Generation (Phase 4) ----------
generation:
  model: claude-opus-4-7   # Opus for clinician-facing answers (GRADE-aware synthesis,
                           # cross-society disagreement, careful refusal). Drop to
                           # claude-sonnet-4-6 for batch eval / large-N runs.
  max_tokens: 1500
  temperature: 0.0         # deterministic; we want grounded extraction, not creativity
  # Strict-grounding system prompt lives in src/generate/ (built in Phase 4).
  refuse_when_no_evidence: true
