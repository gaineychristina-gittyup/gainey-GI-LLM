# Hand-curated questions for scripts/eval_retrieval.py.
#
# Each entry:
#   id: short slug, used in output
#   question: the natural-language clinical question
#   in_corpus: true | false  -- when false, the system should refuse cleanly
#   expect_society: list of societies whose chunks should appear in top-6
#                   (the eval is satisfied if any one is hit)
#   expect_year_min: lower bound on publication year for in-corpus answers
#   expect_recommendation_id: substring that should appear in any cited
#                             recommendation_id (optional)
#   expect_element_types: element types that must appear in top-6 (any-of)
#   notes: free-form

- id: barretts_lgd_surveillance
  question: "What's the recommended endoscopic surveillance interval for low-grade dysplasia in Barrett's esophagus, and what's the GRADE?"
  in_corpus: true
  expect_society: [ACG]
  expect_year_min: 2022
  expect_element_types: [recommendation, table]
  notes: "Canonical test for typed-floor — table chunk is the actual answer."

- id: gastroparesis_first_line
  question: "What's the first-line pharmacologic treatment for diabetic gastroparesis, and do AGA and ACG agree?"
  in_corpus: true
  expect_society: [AGA, ACG]
  expect_year_min: 2022
  expect_element_types: [recommendation, table]
  notes: "Cross-society — society-typed floor must surface ACG recs table."

- id: hpylori_pcn_allergy
