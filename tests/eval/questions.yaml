  in_corpus: true
  expect_society: [ACG]
  expect_year_min: 2024
  expect_element_types: [table]
  notes: "Only Highlights doc in corpus — answer should explicitly note that the full guideline is unavailable; refuse=True is acceptable."

- id: ibsd_first_line
  question: "What pharmacologic options are recommended for IBS-D, and which carries the strongest GRADE?"
  in_corpus: true
  expect_society: [ACG, AGA]
  expect_year_min: 2021
  expect_recommendation_id: "Recommendation"
  expect_element_types: [recommendation]
  notes: "ACG 2021 IBS guideline carries a STRONG rec for rifaximin."

