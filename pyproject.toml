[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-guidelines-rag"
version = "0.1.0"
description = "Guideline-grounded RAG for GI clinical guidelines (AGA, ACG, ASGE, AASLD)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "UNC GI" }]

# Minor versions are pinned; patch versions float so we get bug fixes.
dependencies = [
    # RAG framework
    "llama-index~=0.11.0",
    "llama-index-vector-stores-postgres~=0.2.0",
    "llama-index-embeddings-voyageai~=0.2.0",
    "llama-index-embeddings-openai~=0.2.0",
    "llama-index-llms-anthropic~=0.3.0",
    "llama-index-postprocessor-cohere-rerank~=0.2.0",

    # PDF parsing (hi_res strategy uses detectron2/tesseract under the hood)
    "unstructured[pdf]~=0.15.0",
    # Figure-region cropping for Phase 2 typed-chunk pipeline
    "pymupdf~=1.24",

    # Postgres + pgvector
    "psycopg[binary]~=3.2.0",
    "pgvector~=0.2.5",

    # API clients
    "anthropic~=0.39.0",
    "voyageai~=0.2.3",
    "cohere~=5.11.0",
    "openai~=1.54.0",

    # Backend / frontend (used in later phases)
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "streamlit~=1.40.0",

    # Utilities
    "python-dotenv~=1.0.0",
    "pyyaml~=6.0",
    "requests~=2.32.0",
    "tiktoken~=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-cov~=5.0.0",
    "ruff~=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
