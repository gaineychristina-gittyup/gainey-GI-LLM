# Postgres 16 with pgvector for the GI guidelines RAG vector store.
# Bring up with:  docker compose up -d
# Connect with:   psql postgresql://gi:gi@localhost:5432/gi_guidelines

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gi-guidelines-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: gi
      POSTGRES_PASSWORD: gi
      POSTGRES_DB: gi_guidelines
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is auto-applied on first start (only when the volume is empty)
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gi -d gi_guidelines"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: gi-guidelines-pgdata
